<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked · FocusPilot</title>
<script src="frame-guard.js"></script>
<link rel="stylesheet" href="blocked.css">
</head>
<body>
<main>
  <section id="page">
    <div class="heading">
      <p class="status"><span class="dot" id="dot" aria-hidden="true"></span><span id="status"></span></p>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="actions">
      <button id="primary" type="button"><svg id="primary-arrow" aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5M3 7h9"/></svg><span id="primary-label"></span></button>
      <p class="hint" id="hint"></p>
      <button id="exception" type="button" class="link">Allow for a while…</button>
    </div>
    <p class="note" id="note"></p>
  </section>
  <section id="exception-panel" role="dialog" aria-modal="true" aria-labelledby="x-title" hidden>
    <form class="card" id="exception-form" novalidate>
      <div class="card-head">
        <h2 id="x-title"></h2>
        <span class="badge" id="x-strict" hidden>Strict</span>
      </div>
      <div class="scopes" role="radiogroup" aria-label="Scope" id="x-scopes"></div>
      <div class="segmented" role="radiogroup" aria-label="For" id="x-durations"></div>
      <label class="field" id="x-reason-row">
        <span class="label">Reason</span>
        <input id="x-reason" type="text" maxlength="200" autocomplete="off">
      </label>
      <p class="error" id="x-error" role="alert"></p>
      <div class="card-actions">
        <button id="x-cancel" type="button" class="secondary">Cancel</button>
        <button id="x-allow" type="submit"></button>
      </div>
    </form>
  </section>
</main>
<script src="policy.js"></script>
<script src="blocked-view.js"></script>
<script src="blocked.js"></script>
</body>
</html>
