<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked · FocusPilot</title>
<link rel="stylesheet" href="blocked.css">
</head>
<body>
<main>
  <section id="page">
    <p class="status"><span class="dot" id="dot"></span><span id="status"></span></p>
    <div class="heading">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
      <p class="detail" id="detail"></p>
    </div>
    <div class="actions">
      <button id="primary" type="button"></button>
      <p class="hint" id="hint"></p>
      <a href="#" id="exception">Request a timed exception…</a>
    </div>
  </section>
  <section id="exception-panel" hidden>
    <form class="card" id="exception-form" novalidate>
      <div class="card-head">
        <h2 id="x-title"></h2>
        <span class="badge" id="x-strict" hidden>Strict</span>
      </div>
      <p class="note" id="x-note"></p>
      <div class="field">
        <span class="label" id="x-duration-label">Duration</span>
        <div class="segmented" role="radiogroup" aria-labelledby="x-duration-label" id="x-durations"></div>
      </div>
      <div class="field">
        <span class="label" id="x-scope-label">Scope</span>
        <div class="scopes" role="radiogroup" aria-labelledby="x-scope-label" id="x-scopes"></div>
      </div>
      <label class="field" id="x-reason-row">
        <span class="label">Reason</span>
        <input id="x-reason" type="text" maxlength="200" autocomplete="off">
      </label>
      <p class="wait" id="x-wait"></p>
      <p class="error" id="x-error" role="alert"></p>
      <div class="card-actions">
        <button id="x-cancel" type="button" class="secondary">Cancel</button>
        <button id="x-allow" type="submit"></button>
      </div>
    </form>
  </section>
</main>
<footer><span id="footer-left"></span><span id="footer-right"></span></footer>
<script src="policy.js"></script>
<script src="blocked-view.js"></script>
<script src="blocked.js"></script>
</body>
</html>
